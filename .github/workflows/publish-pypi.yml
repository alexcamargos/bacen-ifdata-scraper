name: Publicar pacote no PyPI

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Verificar versão e empacotar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.9.18'

      - name: Consultar a versão no PyPI
        id: version
        shell: bash
        run: |
          version="$(uv version --short)"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --retry 2 --max-time 15 \
            -- "https://pypi.org/pypi/bacen-ifdata-scraper/${version}/json")"

          case "$status" in
            200)
              echo "A versão ${version} já está no PyPI."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "A versão ${version} está disponível para publicação."
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "A consulta da versão ${version} retornou HTTP ${status}." >&2
              exit 1
              ;;
          esac

      - name: Gerar wheel e distribuição fonte
        if: steps.version.outputs.publish == 'true'
        run: uv build --no-sources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Enviar distribuições ao PyPI
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
