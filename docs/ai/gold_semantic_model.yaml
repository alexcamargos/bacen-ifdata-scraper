schema_version: '1.0'
dataset:
  name: bacen_ifdata_gold
  package: bacen-ifdata-scraper
  source: Banco Central do Brasil - Portal IF.data
  engine: DuckDB
  resolution:
    python_helper: bacen_ifdata.utilities.releases.warehouse_path('gold')
    release_pointer: data/processed/current.json
    open_mode: read_only=True
  temporal_coverage:
    min_id_data: 20000301
    max_id_data: 20260601
    total_quarters: 106
    id_data_format: 'YYYYMMDD (inteiro, sempre dia 01 do mês de fechamento do trimestre: 03, 06, 09, 12)'
  units:
    monetary_values: R$ mil (milhares de reais)
    ratios_and_rates_historical_2000_2024: 'fração decimal (ex.: 0.1651 = 16,51%)'
    ratios_and_rates_current_2025_plus: 'pontos percentuais em fato_ifdata_2025_campos quando formato_valor = ''percentual''
      (ex.: 16.51 = 16,51%)'
    counts: inteiro absoluto
guardrails:
- id: two_accounting_regimes_2025
  rule: 'As 13 tabelas fato históricas e 4 views de relatórios cobrem 2000-03..2024-12 (cosif_ate_2024). Os trimestres
    de 2025-03 em diante (Resolução CMN 4.966 / cosif_desde_2025) ficam em fato_ifdata_2025_campos (formato longo:
    escopo, relatorio, campo_original, valor_numerico). Para série contínua 2014–2026 de Ativo Total e Patrimônio
    Líquido Prudencial, use view_resumo_prudencial_serie e sempre exiba ou considere a coluna regime_contabil.'
- id: percent_scale_2025_diff
  rule: 'Em fato_ifdata_2025_campos, valores com formato_valor = ''percentual'' já estão em pontos percentuais (ex.:
    16.51 = 16,51%) — não multiplique por 100. Nas tabelas históricas (2000–2024), índices como indice_basileia,
    roe e roa estão em fração decimal (ex.: 0.1651 = 16,51%).'
- id: no_double_counting
  rule: 'Nunca somar ou agregar tabelas contábeis sem filtrar tipo_instituicao (ex.: ''Conglomerado Prudencial'',
    ''Conglomerado Financeiro'' ou ''Instituicao Individual''). Atenção à grafia exata ''Instituicao Individual''
    (sem cedilha/acento).'
- id: dre_semiannual_accumulation
  rule: Na DRE (fato_demonstracao_resultado, view_dre_relatorios e lucro_liquido do resumo), março (03) e setembro
    (09) acumulam 3 meses; junho (06) e dezembro (12) acumulam 6 meses. Para total anual de YYYY, some apenas YYYY0601
    + YYYY1201. Para 2T isolado use YYYY0601 - YYYY0301; para 4T isolado use YYYY1201 - YYYY0901.
- id: roe_roa_not_annualized
  rule: As colunas roe e roa são calculadas como lucro_liquido / patrimonio_liquido (ou ativo_total) da própria
    data-base, sem anualização (3 meses em 03/09, 6 meses em 06/12).
- id: credit_portfolio_scope
  rule: As tabelas de carteira de crédito (fato_carteira_credito_*, fato_risco_credito, fato_regiao_credito, fato_operacoes_clientes)
    só existem para Conglomerado Financeiro (2014-06..2024-12) e Conglomerado Financeiro (SCR) (2012-06..2014-03).
    Não filtre por Conglomerado Prudencial nessas tabelas.
- id: capital_scope_transition
  rule: Em fato_capital_prudencial, o período 2000-12..2014-12 está em Conglomerado Financeiro e o período 2015-03..2024-12
    está em Conglomerado Prudencial.
- id: prefer_views_when_available
  rule: Prefira view_resumo_financeiro_relatorios, view_balanco_patrimonial_relatorios, view_dre_relatorios e view_instituicoes_historico_nomes
    para evitar erros de join.
institution_scopes:
- tipo_instituicao: Conglomerado Financeiro
  tipo_relatorio_bcb: Conglomerados Financeiros e Instituições Independentes
  count: 3696
- tipo_instituicao: Instituicao Individual
  tipo_relatorio_bcb: Instituições Individuais
  count: 3284
- tipo_instituicao: Conglomerado Financeiro (SCR)
  tipo_relatorio_bcb: Conglomerados Financeiros e Instituições Independentes
  count: 2199
- tipo_instituicao: Conglomerado Prudencial
  tipo_relatorio_bcb: Conglomerados Prudenciais e Instituições Independentes
  count: 1981
- tipo_instituicao: Instituição de Câmbio
  tipo_relatorio_bcb: Instituições com Operações de Câmbio
  count: 217
