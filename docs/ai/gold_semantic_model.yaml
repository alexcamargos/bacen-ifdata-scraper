  fato_ifdata_2025_campos:
    table_type: BASE TABLE
    description: 1 linha por escopo, relatório, data-base, linha da instituição e coluna publicada (formato longo
      2025+)
    grain: 1 linha por escopo, relatório, data-base, linha da instituição e coluna publicada (formato longo 2025+)
    primary_key:
    - id_data
    coverage_by_scope:
      prudential_conglomerates (14 relatórios): 20250301..20260601
      financial_conglomerates (4 relatórios): 20250301..20260601
      individual_institutions (4 relatórios): 20250301..20260601
    recommended_for:
    - Consulta a qualquer rubrica publicada no leiaute atual (2025-03 em diante, Resolução CMN 4.966) sem perda
      de colunas
    columns:
    - name: id_data
      type: INTEGER
      description: Chave temporal YYYYMMDD (FK lógica para dim_tempo.id_data).
    - name: escopo
      type: VARCHAR
      description: Escopo institucional em snake_case (prudential_conglomerates, financial_conglomerates, individual_institutions).
    - name: relatorio
      type: VARCHAR
      description: 'Identificador do relatório em snake_case (ex.: summary, assets, liabilities, income_statement,
        capital_information).'
    - name: data_base
      type: DATE
      description: Data de referência do trimestre (DATE).
    - name: linha
      type: BIGINT
      description: Posição da linha da instituição no CSV publicado.
    - name: ordem_coluna
      type: INTEGER
      description: Posição ordinal da coluna no CSV publicado.
    - name: codigo
      type: VARCHAR
      description: Código identificador da instituição no IF.data.
    - name: instituicao
      type: VARCHAR
      description: Nome da instituição publicado na data-base.
    - name: campo_original
      type: VARCHAR
      description: Nome exato da coluna/rubrica conforme publicado pelo Bacen.
    - name: eh_dimensao
      type: BOOLEAN
      description: Indica se a coluna é atributo cadastral/dimensional (true) ou medida numérica/indicador (false).
    - name: valor_original
      type: VARCHAR
      description: Texto original publicado no CSV (preserva marcadores como NI; células vazias ficam NULL).
    - name: valor_numerico
      type: DECIMAL(38,8)
      description: Valor numérico convertido para DECIMAL(38,8) na escala publicada (percentuais em pontos percentuais).
    - name: formato_valor
      type: VARCHAR
      description: Marcador de formato ('percentual' quando em pontos percentuais; NULL nos demais casos).
    - name: arquivo_origem
      type: VARCHAR
      description: Caminho relativo do CSV bruto versionado de origem.
